<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prêt-express</title>
<style>
:root{--bg:#F4F6F8;--cd:#fff;--ink:#14213D;--mut:#5B6577;--ac:#0B7A5C;--ac2:#F2A900;--bd:#D9DEE6}
@media (prefers-color-scheme:dark){:root{--bg:#0F1626;--cd:#18223A;--ink:#EEF1F6;--mut:#9AA6BC;--ac:#3DC79B;--ac2:#F2B83A;--bd:#2B3855;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
.w{max-width:720px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font:700 22px system-ui}.logo b{color:var(--ac)}
h1{font-size:26px;line-height:1.2;margin:20px 0 8px}h2{margin:0 0 8px}
input,select{font:inherit;color:var(--ink);background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
select#pays{width:auto;max-width:60%}
input[type=range]{padding:0;accent-color:var(--ac)}
label{display:block;font-weight:600;margin:12px 0 4px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.tabs button{flex:1 1 28%;padding:10px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--ink);font:600 14px system-ui;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.big{font:700 24px system-ui;color:var(--ac)}.mut{color:var(--mut);font-size:14px}.m{background:var(--cd);border:1px solid var(--ac2);border-radius:10px;padding:10px}
.btn{background:var(--ac2);color:#14213D;border:0;border-radius:10px;padding:12px 16px;font:700 16px system-ui;cursor:pointer;width:100%;margin-top:14px}
.s{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:600 14px system-ui;cursor:pointer;width:auto;margin:0}
.s.n{background:var(--mut)}
</style>
</head>
<body>
<div class="w">
<header><div class="logo">Prêt<b>-express</b></div><select id="pays" aria-label="Pays"></select><button id="out" class="s" hidden onclick="SB.auth.signOut()">Sortir</button></header>
<main id="app"><p class="mut">Chargement…</p></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SB=supabase.createClient("https://kknzmfhepdsffpwvvhkd.supabase.co","sb_publishable_oVNvlc-9kNmzg8qstSqznw_V3rtXjeY");
const P={"Bénin":["XOF",1],"Côte d’Ivoire":["XOF",1],"Sénégal":["XOF",1],"Mali":["XOF",1],"Burkina Faso":["XOF",1],"Niger":["XOF",1],"Togo":["XOF",1],"Cameroun":["XAF",1],"Gabon":["XAF",1],"Congo-Brazzaville":["XAF",1],"Tchad":["XAF",1],"RD Congo":["CDF",4],"Guinée":["GNF",13],"Madagascar":["MGA",7],"Maroc":["MAD",.016],"Tunisie":["TND",.005],"Algérie":["DZD",.22],"Rwanda":["RWF",2.2],"Burundi":["BIF",4.7],"Comores":["KMF",.75],"Djibouti":["DJF",.3]};
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cur=()=>P[$("pays").value];
const fmt=x=>Math.round(x*cur()[1]).toLocaleString("fr-FR")+" "+cur()[0];
const lg=(a,d)=>SB.from("journal").insert({user_id:me.id,action:a,details:d});
Object.keys(P).forEach(k=>$("pays").add(new Option(k+" ("+P[k][0]+")",k)));$("pays").value="Bénin";
let me=null,prof=null,tab="acc",msg="";
const ST={non_verifie:"Non vérifié",attente:"En attente de validation",verifie:"Vérifié"};

async function load(){prof=null;
 if(me){let r=await SB.from("profiles").select("*").eq("id",me.id).maybeSingle();prof=r.data;
  if(!prof){await SB.from("profiles").insert({id:me.id,full_name:me.user_metadata?.full_name||null});r=await SB.from("profiles").select("*").eq("id",me.id).maybeSingle();prof=r.data}}
 $("out").hidden=!me;draw()}
const go=t=>{tab=t;msg="";draw()};
$("pays").onchange=()=>draw();

async function auth(up){const e=$("em").value.trim(),p=$("pw").value;
 const r=up?await SB.auth.signUp({email:e,password:p,options:{data:{full_name:$("fn").value.trim()}}}):await SB.auth.signInWithPassword({email:e,password:p});
 if(r.error)msg=r.error.message;else if(up&&!r.data.session)msg="Compte créé. Confirmez votre e-mail, puis connectez-vous.";
 draw()}

const sc=()=>Math.max(20,Math.min(95,40+(+$("mm").value)*12+($("gar").checked?15:0)+($("edu").checked?10:0)-Math.round($("mt").value/2000000*12)));
const tx=s=>Math.round((34-(s-20)*0.2)*10)/10;
function calc(){const m=+$("mt").value,d=+$("du").value,s=sc(),t=tx(s),tot=m*(1+t/100*d/12);
 $("mtv").textContent=fmt(m);$("duv").textContent=d;$("sc").textContent=s+"/100";$("tx").textContent=t+" %";$("me").textContent=fmt(tot/d);$("to").textContent=fmt(tot)}

async function send(){
 if(prof?.kyc_status!=="verifie"){tab="kyc";msg="Vérifiez d’abord votre identité.";return draw()}
 const m=+$("mt").value,s=sc();
 const{error}=await SB.from("loan_requests").insert({borrower_id:me.id,country:$("pays").value,currency:cur()[0],amount:m,months:+$("du").value,purpose:$("obj").value,score:s,rate:tx(s)});
 msg=error?error.message:"Demande envoyée. Elle sera visible des prêteurs après approbation.";
 if(!error)await lg("Demande",fmt(m)+" sur "+$("du").value+" mois");draw()}

async function fund(id){const{error}=await SB.from("fundings").insert({loan_id:id,lender_id:me.id,amount:50000});
 msg=error?error.message:"Financement de "+fmt(50000)+" enregistré.";if(!error)await lg("Financement",fmt(50000));draw()}

async function kyc(){const v=i=>$(i).value.trim();
 if(!v("kn")||!v("kt")||!v("kp")){msg="Remplissez tous les champs.";return draw()}
 const{error}=await SB.from("kyc_submissions").insert({user_id:me.id,full_name:v("kn"),phone:v("kt"),doc_type:$("kd").value,doc_number:v("kp")});
 if(!error){await lg("Vérification","Dossier envoyé");msg="Dossier envoyé. Un administrateur va le valider."}else msg=error.message;draw()}

async function adm(k,id,v,uid){
 if(k==="k"){await SB.from("kyc_submissions").update({status:v}).eq("id",id);if(v==="ok")await SB.from("profiles").update({kyc_status:"verifie"}).eq("id",uid)}
 else await SB.from("loan_requests").update({status:v}).eq("id",id);draw()}

const V={
 acc:async()=>`<h1>Prêtez et empruntez entre particuliers, partout dans la francophonie.</h1>
 <p class="mut">Bonjour ${esc(prof?.full_name||me.email)}. Statut d’identité : <b>${ST[prof?.kyc_status]||"…"}</b></p>
 <div class="card"><h2>Comment ça marche</h2><ol><li>Vérifiez votre identité.</li><li>Publiez une demande ou financez celle d’un autre.</li><li>Suivez tout dans votre cahier.</li></ol></div>`,
 emp:async()=>`<div class="card"><h2>Ma demande</h2>
 <label for="mt">Montant : <span id="mtv"></span></label><input type="range" id="mt" min="10000" max="2000000" step="10000" value="200000" oninput="calc()">
 <label for="du">Durée : <span id="duv"></span> mois</label><input type="range" id="du" min="1" max="12" value="6" oninput="calc()">
 <label for="obj">Objet</label><select id="obj"><option>Commerce</option><option>Agriculture</option><option>Études</option><option>Santé</option><option>Équipement</option></select>
 <label for="mm">Historique mobile money</label><select id="mm" onchange="calc()"><option value="0">Moins de 6 mois</option><option value="1" selected>6 à 24 mois</option><option value="2">Plus de 24 mois</option></select>
 <label><input type="checkbox" id="gar" onchange="calc()" style="width:auto"> Un garant ou un groupe me soutient</label>
 <label><input type="checkbox" id="edu" onchange="calc()" style="width:auto"> J’ai suivi l’éducation financière</label></div>
 <div class="card"><div class="row"><span>Score estimé</span><span class="big" id="sc"></span></div>
 <div class="row"><span>Taux annuel</span><b id="tx"></b></div><div class="row"><span>Mensualité</span><b id="me"></b></div><div class="row"><span>Total à rembourser</span><b id="to"></b></div>
 <button class="btn" onclick="send()">Publier ma demande</button></div>`,
 pre:async()=>{const{data}=await SB.from("loan_requests").select("*").eq("status","ok").order("created_at",{ascending:false});
  return (data||[]).map(x=>`<div class="card"><div class="row"><b>${esc(x.purpose)}</b><span class="mut">Score ${x.score}</span></div><div class="mut">${esc(x.country)} · ${x.months} mois · taux ${x.rate} %</div><div class="row"><span>${fmt(x.amount)}</span>${x.borrower_id===me.id?'<span class="mut">Ma demande</span>':`<button class="s" onclick="fund('${x.id}')">Financer ${fmt(50000)}</button>`}</div></div>`).join("")||'<p class="mut">Aucune demande approuvée pour le moment.</p>'},
 kyc:async()=>`<div class="card"><h2>Vérification d’identité</h2><p>Statut : <b>${ST[prof?.kyc_status]||"…"}</b></p>
 <label for="kn">Nom complet</label><input id="kn"><label for="kt">Téléphone mobile money</label><input id="kt" placeholder="+229 …">
 <label for="kd">Pièce d’identité</label><select id="kd"><option>Carte d’identité</option><option>Passeport</option><option>Carte d’électeur</option></select>
 <label for="kp">Numéro de la pièce</label><input id="kp"><p class="mut">L’envoi de photos sera ajouté dans une prochaine version.</p>
 <button class="btn" onclick="kyc()">Envoyer pour vérification</button></div>`,
 cah:async()=>{const{data}=await SB.from("journal").select("*").eq("user_id",me.id).order("created_at",{ascending:false}).limit(50);
  return (data||[]).map(j=>`<div class="card"><div class="row"><b>${esc(j.action)}</b><span class="mut">${new Date(j.created_at).toLocaleString("fr-FR")}</span></div>${esc(j.details)}</div>`).join("")||'<p class="mut">Rien pour l’instant.</p>'},
 adm:async()=>{if(prof?.role!=="admin")return"";
  const a=await SB.from("kyc_submissions").select("*").eq("status","attente"),b=await SB.from("loan_requests").select("*").eq("status","attente");
  const k=(a.data||[]).map(x=>`<div class="card"><b>${esc(x.full_name)}</b> · ${esc(x.phone)}<div class="mut">${esc(x.doc_type)} ${esc(x.doc_number)}</div><div class="row" style="margin-top:8px;justify-content:flex-start"><button class="s" onclick="adm('k','${x.id}','ok','${x.user_id}')">Valider</button><button class="s n" onclick="adm('k','${x.id}','no','${x.user_id}')">Rejeter</button></div></div>`).join("");
  const l=(b.data||[]).map(x=>`<div class="card"><b>${esc(x.purpose)}</b> · ${fmt(x.amount)} · ${x.months} mois<div class="mut">${esc(x.country)} · score ${x.score}</div><div class="row" style="margin-top:8px;justify-content:flex-start"><button class="s" onclick="adm('l','${x.id}','ok')">Approuver</button><button class="s n" onclick="adm('l','${x.id}','no')">Refuser</button></div></div>`).join("");
  return "<h2>Identités à valider</h2>"+(k||'<p class="mut">Aucune.</p>')+"<h2>Demandes à approuver</h2>"+(l||'<p class="mut">Aucune.</p>')}
};

async function draw(){const a=$("app");
 if(!me){a.innerHTML=`<h1>Connexion</h1>${msg?`<p class="m">${esc(msg)}</p>`:""}<div class="card"><label for="fn">Prénom (pour créer un compte)</label><input id="fn"><label for="em">E-mail</label><input id="em" type="email" autocomplete="email"><label for="pw">Mot de passe (8 caractères minimum)</label><input id="pw" type="password" autocomplete="current-password"><button class="btn" onclick="auth(false)">Se connecter</button><button class="btn" style="background:var(--ac);color:#fff" onclick="auth(true)">Créer un compte</button></div>`;return}
 const T=[["acc","Accueil"],["emp","Emprunter"],["pre","Prêter"],["kyc","Vérification"],["cah","Cahier"]];if(prof?.role==="admin")T.push(["adm","Admin"]);
 let h=`<div class="tabs">${T.map(([k,l])=>`<button class="${k===tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}</div>${msg?`<p class="m">${esc(msg)}</p>`:""}`;
 h+=await V[tab]();a.innerHTML=h;if(tab==="emp")calc()}

SB.auth.getSession().then(r=>{me=r.data.session?.user||null;SB.auth.onAuthStateChange((_e,s)=>{me=s?.user||null;load()});load()});
</script>
</body>
</html>
